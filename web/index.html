<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>任务清单</title>
<link rel="stylesheet" href="main.css">
</head>
<body>

<!-- ========== 顶部栏 ========== -->
<header>
  <h1>📋 任务</h1>
  <span id="loading-hint" class="loading-hint"></span>
  <div class="actions">
    <button id="add-btn">添加任务</button>
    <button id="reset-floating-btn">重置浮窗</button>
    <button id="refresh-btn">刷新任务</button>
    <button id="settings-btn">设置</button>
  </div>
</header>

<div id="banners"></div>

<div class="tabs">
  <button class="tab active" data-tab="todo">未完成 <span class="count" id="cnt-todo">0</span></button>
  <button class="tab" data-tab="done">已完成 <span class="count" id="cnt-done">0</span></button>
</div>

<div id="content"></div>

<!-- ========== 弹窗 1：添加任务 ========== -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h2>添加任务</h2>
    <div class="error" id="modal-error"></div>
    <div class="field">
      <label>标题 *</label>
      <input id="m-title" placeholder="例如：写实验报告" />
    </div>
    <div class="field">
      <label>课程 / 备注</label>
      <input id="m-course" placeholder="可选" />
    </div>
    <div class="field">
      <label>截止时间 *</label>
      <input id="m-due" type="datetime-local" />
      <div class="hint">格式：年-月-日 时:分</div>
    </div>
    <div class="field">
      <label>链接</label>
      <input id="m-url" placeholder="可选" />
    </div>
    <div class="modal-actions">
      <button class="cancel" id="m-cancel">取消</button>
      <button class="ok" id="m-ok">添加</button>
    </div>
  </div>
</div>

<!-- ========== 弹窗 2：设置 ========== -->
<div class="modal-bg" id="settings-bg">
  <div class="modal" style="width: 660px;">
    <h2>设置</h2>

    <div class="section">
      <h3>🌐 网站设置</h3>
      <div id="site-list"></div>
      <div class="section-actions">
        <span class="apply-hint" id="apply-hint"></span>
        <button id="apply-sites-btn">应用</button>
      </div>
    </div>

    <div class="section">
      <h3>🚀 开机自启动</h3>
      <div class="auto-row">
        <div class="switch" id="autostart-switch"></div>
        <div class="label">开机自动启动任务清单</div>
        <div class="status" id="autostart-status">未开启</div>
      </div>
      <div class="auto-hint">开启后，每次开机并联网后自动启动。</div>
    </div>

    <div class="modal-actions">
      <button class="cancel" id="s-close">关闭</button>
    </div>
  </div>
</div>

<!-- ========== 弹窗 3：填账号密码 ========== -->
<div class="modal-bg" id="cred-bg">
  <div class="modal">
    <h2>填写账号密码</h2>
    <div class="error" id="cred-error"></div>
    <div style="font-size:13px;color:#7f8c8d;margin-bottom:14px;" id="cred-tip">
      填好后，登录状态失效时程序会在后台自动重新登录，不需要你手动操作。
    </div>

    <div class="field" id="cred-binding-wrap" style="display:none;">
      <label>Basic Auth 账号（可选）</label>
      <input id="cred-binding-user" placeholder="打开网站时浏览器弹窗的账号" />
      <label style="margin-top:8px;">Basic Auth 密码（可选）</label>
      <input id="cred-binding-pass" type="password" placeholder="打开网站时浏览器弹窗的密码" />
    </div>

    <div class="field" id="cred-school-wrap" style="display:none;">
      <label>学校全名</label>
      <input id="cred-school" placeholder="例如：XX大学" />
    </div>

    <div class="field">
      <label id="cred-user-label">账号 / 学号</label>
      <input id="cred-user" placeholder="填写你的账号" />
    </div>
    <div class="field">
      <label id="cred-pass-label">密码</label>
      <input id="cred-pass" type="password" placeholder="填写你的密码" />
    </div>
    <div class="modal-actions">
      <button class="cancel" id="cred-cancel">取消</button>
      <button class="ok" id="cred-ok">保存</button>
    </div>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
